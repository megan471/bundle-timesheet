<!doctype html>
<html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bundle Time Log</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#FBF5E6;--paper:#FFFDF7;--sunk:#F3EBD8;--ink:#16130F;--muted:#6A6256;--line:#E2D7C0;--magenta:#D1107A;--blue:#1C57C9;--yellow:#FFC914;--good:#17754A;--good-bg:#DDF1E5;--warn:#8F5600;--warn-bg:#FCEBC6;--bad:#BC2319;--bad-bg:#FBE0DC;--info:#DFE8FA;--display:"Bricolage Grotesque","Trebuchet MS",sans-serif;--body:"Instrument Sans","Segoe UI",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);padding:20px max(16px,env(safe-area-inset-left,0px)) 56px}
#app{max-width:1080px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:18px}h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em}h1{font-size:32px;font-weight:800;line-height:1.1}h2{font-size:20px}h3{font-size:16px}p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}a{color:var(--blue)}:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-end}.eyebrow{font:12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}.chips{display:inline-flex;gap:3px;margin-right:8px}.chips i{width:10px;height:10px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:clamp(16px,2.6vw,26px);display:grid;grid-template-columns:minmax(0,1fr);gap:16px;min-width:0}.muted{color:var(--muted)}.small{font-size:13px}.mono{font:12.5px var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.between{justify-content:space-between}
.btn{border:1px solid var(--ink);background:transparent;padding:8px 14px;border-radius:5px;cursor:pointer;font-weight:600;font-size:14px}.btn:hover{background:var(--sunk)}.btn.primary{background:var(--magenta);border-color:var(--magenta);color:#fff}.btn.go{background:var(--good);border-color:var(--good);color:#fff}.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff}.btn.quiet{border-color:var(--line);font-weight:500}.btn.sm{padding:4px 9px;font-size:13px}.btn[disabled]{opacity:.5;cursor:not-allowed}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 6px}.x:hover{color:var(--bad)}.x.sure{background:var(--bad);color:#fff;border-radius:4px}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info);color:var(--blue)}
label.f{display:grid;gap:3px;min-width:0}label.f>span{font-size:12.5px;font-weight:600;color:var(--muted)}input[type=text],input[type=url],input[type=email],input[type=password],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:8px 9px;width:100%;min-width:0}textarea{min-height:90px;resize:vertical}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.s2{grid-column:span 2}.form{background:var(--sunk);padding:14px;border-radius:7px;display:grid;gap:12px}
.timer{background:var(--ink);color:#FFFDF7;border-radius:8px;padding:20px;display:grid;gap:10px}.clock{font:500 clamp(44px,10vw,72px)/1 var(--mono);font-variant-numeric:tabular-nums}.timer .btn{border-color:#FFFDF7;color:#FFFDF7}.timer .btn.stop{border-color:var(--bad);color:#fff}
.check{background:var(--yellow);color:var(--ink);padding:12px;border-radius:6px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}.check .btn{color:var(--ink);border-color:var(--ink)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--ink);white-space:nowrap}td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}.num{text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{border-top:3px solid var(--ink);padding-top:6px}.stat b{font-family:var(--display);font-size:25px;display:block;line-height:1.15}
.tools{display:flex;flex-wrap:wrap;gap:6px 14px}.tools label{display:flex;gap:5px;align-items:center;font-size:14px}.empty{color:var(--muted);font-size:14px;padding:6px 0}.block{padding:18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:7px}
.login{max-width:380px;margin:9vh auto 0}#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ink);color:#FFFDF7;padding:9px 15px;border-radius:6px;font-weight:600;font-size:14px;z-index:9;max-width:90vw}
@media(max-width:760px){.g4,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){.g2,.g4{grid-template-columns:1fr}.s2{grid-column:auto}}
@media print{body{background:#fff;padding:0}.noprint,.btn,.x,#toast{display:none!important}.sheet{border:0;padding:0}}
</style></head><body><div id="app"><div class="block">Loading</div></div><div id="toast" hidden></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged,sendPasswordResetEmail} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {getFirestore,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,onSnapshot,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCa4GqI08WUtI6nkX_T7Bd5fNVoQApAAmg",
  authDomain: "bundle-timesheet.firebaseapp.com",
  projectId: "bundle-timesheet",
  storageBucket: "bundle-timesheet.firebasestorage.app",
  messagingSenderId: "978217068024",
  appId: "1:978217068024:web:92fcc5e0e2404bab5d620d"
};

const TEAM={'megan@bundlemedia.africa':{name:'Megan',mgr:true},'stacey@bundlemedia.africa':{name:'Stacey',mgr:true},'casey@bundlemedia.africa':{name:'Casey',mgr:false}};
const TOOLS=['Canva','Claude','ChatGPT','Adobe','VEED','Freepik','Higgsfield','Other'];
const TARGET=420,CHECK=60*60000,GRACE=5*60000,START='08:30',END='16:30';
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb);
const S={tasks:[],entries:[],days:{},running:null},ui={user:null,week:null,sure:null,edit:null,typed:false,loaded:false};const D={};let pending=false,closing=false,subs=[];
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=()=>iso(new Date()),parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)},add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)},monday=s=>add(s,-((parse(s).getDay()+6)%7));
const DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],short=s=>{const d=parse(s);return`${DN[d.getDay()]} ${d.getDate()} ${MN[d.getMonth()]}`};
const ms=t=>!t?0:t.toMillis?t.toMillis():t.getTime?t.getTime():+t,hm=t=>{const d=new Date(ms(t));return`${pad(d.getHours())}:${pad(d.getMinutes())}`},mins=e=>Math.max(0,Math.round((ms(e.endAt)-ms(e.startAt))/60000)),dur=m=>`${Math.floor(m/60)}h ${pad(m%60)}m`;
const v=(f,k,fb='')=>D[f]&&k in D[f]?D[f][k]:fb,toast=m=>{const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3800)};
async function save(fn,ok){try{await fn();if(ok)toast(ok);return true}catch(e){console.warn(e);toast(e.code==='permission-denied'?'You don\'t have permission to do that.':'That didn\'t save. Check your connection and try again.');return false}}
function field(f,k,label,o={}){const val=v(f,k,o.value??''),id=`${f}-${k}`.replace(/\W/g,'-'),ds=`data-d="${esc(f+'|'+k)}"`;let c;
 if(o.options)c=`<select id="${id}" ${ds}${o.live?' data-live="1"':''}>${o.options.map(x=>{const[a,b]=Array.isArray(x)?x:[x,x];return`<option value="${esc(a)}"${String(val)===String(a)?' selected':''}>${esc(b)}</option>`}).join('')}</select>`;
 else if(o.area)c=`<textarea id="${id}" ${ds} placeholder="${esc(o.ph||'')}">${esc(val)}</textarea>`;else c=`<input id="${id}" ${ds} type="${o.type||'text'}" value="${esc(val)}" placeholder="${esc(o.ph||'')}">`;
 return`<label class="f${o.cls?' '+o.cls:''}" for="${id}"><span>${esc(label)}</span>${c}</label>`}
const del=(act,id,lab='Delete')=>{const k=act+id;return`<button class="x${ui.sure===k?' sure':''}" data-a="sure" data-k="${esc(k)}" data-act="${act}" data-id="${esc(id)}">${ui.sure===k?'Confirm':lab}</button>`};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
const dayEntries=d=>S.entries.filter(e=>e.date===d&&!e.needsDetail).sort((a,b)=>ms(a.startAt)-ms(b.startAt));
const dayMins=d=>dayEntries(d).reduce((p,e)=>p+mins(e),0),submitted=d=>!!S.days[d]?.submittedAt,canLog=d=>!submitted(d)&&(d===today()||S.days[d]?.reopened===true);
const taskMins=id=>S.entries.filter(e=>e.taskId===id&&!e.needsDetail).reduce((p,e)=>p+mins(e),0);

/* employee */
function openTasks(){return S.tasks.filter(t=>!t.done).sort((a,b)=>a.date.localeCompare(b.date))}
function vEmployee(){const t=today(),pend=S.entries.find(e=>e.needsDetail),r=S.running,total=dayMins(t),sub=submitted(t);let top;
 if(r){const due=Date.now()-ms(r.confirmedAt)>=CHECK;top=`<section class="timer"><div class="small">Working on</div><h2>${esc(r.taskTitle)}</h2><div class="clock" id="clock">0:00:00</div>${due?`<div class="check"><strong>Still working on this?</strong><button class="btn" data-a="confirm">Yes, still working</button></div>`:''}<div><button class="btn stop" data-a="stop">Stop timer</button></div></section>`}
 else if(pend){const f='det:'+pend.id;top=`<section class="sheet"><div><h2>What did you do?</h2><p class="muted small">${esc(pend.taskTitle)} · ${hm(pend.startAt)} to ${hm(pend.endAt)} · ${dur(mins(pend))}${pend.unconfirmed?' · The timer stopped because the hourly check-in was missed':''}</p></div>
  <form class="form" data-form="detail" data-id="${esc(pend.id)}"><div><div class="small muted" style="font-weight:600">Software used</div><div class="tools">${TOOLS.map(x=>`<label><input type="checkbox" data-d="${esc(f+'|t:'+x)}"${v(f,'t:'+x,false)?' checked':''}>${x}</label>`).join('')}</div></div>${field(f,'detail','Detail of the work',{area:1,ph:'Client, which posts or videos, what was finished, what is left'})}${field(f,'proof','Link to the work',{type:'url',ph:'Canva, Google Doc or Drive link'})}<label class="row small"><input type="checkbox" data-d="${esc(f+'|fin')}"${v(f,'fin',false)?' checked':''}>This task is finished</label><div><button class="btn primary">Save entry</button></div></form></section>`}
 else if(sub)top=`<section class="sheet"><h2>Day submitted</h2><p class="muted">Submitted at ${hm(S.days[t].submittedAt)}. Total ${dur(total)}.</p></section>`;
 else{const open=openTasks(),sel=v('start','task',open[0]?.id||'other');top=`<section class="sheet"><h2>Start work</h2><form class="form" data-form="start"><div class="g2">${field('start','task','Task',{value:sel,live:1,options:[...open.map(x=>[x.id,`${x.title}${x.client?' ('+x.client+')':''} · due ${short(x.date)}`]),['other','Other work']]})}${sel!=='other'&&S.tasks.find(x=>x.id===sel)?.note?`<p class="small muted s2">${esc(S.tasks.find(x=>x.id===sel).note)}</p>`:''}${sel==='other'?field('start','other','What is it?',{ph:'e.g. Client call, admin'}):''}</div><div><button class="btn go">Start timer</button></div></form></section>`}
 const ents=dayEntries(t),wk=monday(t),grp=[['Overdue',x=>x.date<t],['Due today',x=>x.date===t],['Later this week',x=>x.date>t&&x.date<=add(wk,6)],['Next week and later',x=>x.date>add(wk,6)]],open=openTasks(),fin=S.tasks.filter(x=>x.done&&x.date>=wk).sort((a,b)=>a.date.localeCompare(b.date));
 const tbl=l=>`<div class="tw"><table><thead><tr><th>Task</th><th>Client</th><th>Due</th><th class="num">Time logged</th></tr></thead><tbody>${l.map(x=>`<tr><td>${esc(x.title)}${x.note?`<div class="small muted">${esc(x.note)}</div>`:''}</td><td>${esc(x.client)}</td><td class="mono">${short(x.date)}</td><td class="num">${dur(taskMins(x.id))}</td></tr>`).join('')}</tbody></table></div>`;
 return`${top}<section class="sheet"><div class="row between"><h2>${short(t)}</h2><strong>${dur(total)} logged</strong></div>
 <div><h3>My task list</h3><p class="small muted">Work through these in any order. Finish what's due first, then move on to the next.</p></div>
 ${open.length?grp.map(([h,f])=>{const l=open.filter(f);return l.length?`<div><h3 class="small" style="font-family:var(--body);text-transform:uppercase;letter-spacing:.05em;color:${h==='Overdue'?'var(--bad)':'var(--muted)'}">${h} (${l.length})</h3>${tbl(l)}</div>`:''}).join(''):'<p class="empty">No open tasks.</p>'}
 ${fin.length?`<div><h3 class="small" style="font-family:var(--body);text-transform:uppercase;letter-spacing:.05em;color:var(--good)">Finished this week (${fin.length})</h3>${tbl(fin)}</div>`:''}
 <div><h3>Today's log</h3>${ents.length?`<div class="tw"><table><thead><tr><th>Time</th><th>Work</th><th>Software</th><th class="num">Length</th></tr></thead><tbody>${ents.map(e=>`<tr><td class="mono">${hm(e.startAt)}–${hm(e.endAt)}</td><td><strong>${esc(e.taskTitle)}</strong><div class="small">${esc(e.detail)}</div></td><td>${esc((e.tools||[]).join(', '))}</td><td class="num">${dur(mins(e))}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Nothing logged yet today.</p>'}</div>
 ${r||pend||sub?'':`<div class="row"><button class="btn quiet" data-a="typed">${ui.typed?'Close':'Add time without the timer'}</button>${ents.length?`<button class="btn primary" data-a="sure" data-k="submit" data-act="submit">${ui.sure==='submit'?'Confirm: submit the day':'Submit my day'}</button>`:''}</div>${ui.typed?vTyped():''}`}</section>`}
function vTyped(){const f='typed',open=S.tasks.filter(t=>!t.done);return`<form class="form" data-form="typed"><div class="g4">${field(f,'date','Date',{type:'date',value:today()})}${field(f,'from','From',{type:'time'})}${field(f,'to','To',{type:'time'})}${field(f,'task','Task',{options:[...open.map(x=>[x.id,x.title]),['other','Other work']]})}</div><div class="tools">${TOOLS.map(x=>`<label><input type="checkbox" data-d="typed|t:${x}"${v(f,'t:'+x,false)?' checked':''}>${x}</label>`).join('')}</div>${field(f,'reason','Why wasn\'t the timer used?')}${field(f,'detail','Detail of the work',{area:1})}${field(f,'proof','Link to the work',{type:'url'})}<div><button class="btn primary">Add entry</button></div></form>`}

/* manager */
function eFlags(e){const out=[],h=hm(e.startAt),end=hm(e.endAt);if(e.method==='typed')out.push(['Typed in, no timer','warn']);if(e.unconfirmed)out.push(['Check-in missed','bad']);if(!safeUrl(e.proof))out.push(['No link','warn']);if((e.detail||'').trim().length<40)out.push(['Thin detail','warn']);if(h<START||end>END)out.push(['Outside hours','info']);if(e.detailAt&&ms(e.detailAt)-ms(e.endAt)>3600000)out.push(['Detail added late','warn']);return out}
function dFlags(d){const es=dayEntries(d),out=[];if(d>today())return out;if(!es.length)return[['Nothing logged','bad']];const first=hm(es[0].startAt);if(first>'08:45')out.push([`First start ${first}`,'warn']);let g=0;for(let i=1;i<es.length;i++)g=Math.max(g,(ms(es[i].startAt)-ms(es[i-1].endAt))/60000);if(g>75)out.push([`Gap of ${dur(Math.round(g))}`,'warn']);if(dayMins(d)<TARGET)out.push([`Under ${dur(TARGET)}`,'warn']);if(!submitted(d)&&d<today())out.push(['Not submitted','bad']);return out}
const pills=l=>l.map(([t,c])=>`<span class="pill ${c}">${esc(t)}</span>`).join(' ');
function vManager(){const m=ui.week,days=[0,1,2,3,4].map(i=>add(m,i)),fri=days[4],ws=S.entries.filter(e=>e.date>=m&&e.date<=fri&&!e.needsDetail),total=ws.reduce((p,e)=>p+mins(e),0),flags=ws.reduce((p,e)=>p+eFlags(e).length,0)+days.reduce((p,d)=>p+dFlags(d).length,0);
 const tool={};ws.forEach(e=>(e.tools||[]).forEach(t=>tool[t]=(tool[t]||0)+mins(e)));const tks=S.tasks.filter(t=>t.date>=m&&t.date<=fri).sort((a,b)=>a.date.localeCompare(b.date)),r=S.running;
 return`<section class="sheet noprint"><div class="row between"><h2>Give Casey work</h2></div><form class="form" data-form="task"><div class="g4">${field('task','title','Task',{cls:'s2',ph:'e.g. Remedy Shoppe December carousels'})}${field('task','client','Client')}${field('task','date','Due',{type:'date',value:today()})}${field('task','est','Expected time (minutes)',{type:'number',ph:'e.g. 90'})}${field('task','note','Instructions',{cls:'s2'})}</div><div><button class="btn primary">Add task</button></div></form></section>
 <section class="sheet"><div class="row between"><div class="row"><button class="btn quiet sm noprint" data-a="wk" data-n="-7">Previous</button><h2>${short(m)} to ${short(fri)}</h2><button class="btn quiet sm noprint" data-a="wk" data-n="7">Next</button></div><div class="row noprint"><button class="btn sm" data-a="csv">Download CSV</button><button class="btn sm" data-a="print">Print or save PDF</button></div></div>
 ${r?`<p><span class="pill good">Timer running</span> ${esc(r.taskTitle)}, started ${hm(r.startedAt)}, last check-in ${hm(r.confirmedAt)}</p>`:'<p class="muted small">No timer running right now.</p>'}
 <div class="stats"><div class="stat"><b>${dur(total)}</b><span class="small muted">Logged this week</span></div><div class="stat"><b>${days.filter(submitted).length}/5</b><span class="small muted">Days submitted</span></div><div class="stat"><b>${tks.filter(t=>t.done).length}/${tks.length}</b><span class="small muted">Tasks finished</span></div><div class="stat"><b>${flags}</b><span class="small muted">Things to check</span></div></div>
 ${days.map(d=>{const es=dayEntries(d),fl=dFlags(d);return`<div><div class="row between"><h3>${short(d)} · ${dur(dayMins(d))}</h3><div class="row">${pills(fl)}${submitted(d)?`<span class="pill good">Submitted ${hm(S.days[d].submittedAt)}</span><button class="x noprint" data-a="reopen" data-id="${d}">Reopen</button>`:(d<today()&&!S.days[d]?.reopened?`<button class="x noprint" data-a="reopen" data-id="${d}">Allow catch-up</button>`:'')}</div></div>${es.length?`<div class="tw"><table><thead><tr><th>Time</th><th class="num">Length</th><th>Work and detail</th><th>Software</th><th>Link</th><th>To check</th><th class="noprint">Checked</th></tr></thead><tbody>${es.map(e=>`<tr><td class="mono">${hm(e.startAt)}–${hm(e.endAt)}</td><td class="num">${dur(mins(e))}</td><td><strong>${esc(e.taskTitle)}</strong><div class="small">${esc(e.detail)}</div>${e.reason?`<div class="small muted">No timer: ${esc(e.reason)}</div>`:''}</td><td>${esc((e.tools||[]).join(', '))}</td><td>${safeUrl(e.proof)?`<a href="${esc(e.proof)}" target="_blank" rel="noopener">Open</a>`:'–'}</td><td>${pills(eFlags(e))}</td><td class="noprint"><input type="checkbox" aria-label="Checked" data-a="checked" data-id="${esc(e.id)}"${e.checked?' checked':''}> ${del('entry',e.id)}</td></tr>`).join('')}</tbody></table></div>`:''}</div>`}).join('')}</section>
 <section class="sheet"><h2>Tasks: expected against actual</h2>${tks.length?`<div class="tw"><table><thead><tr><th>Task</th><th>Due</th><th class="num">Expected</th><th class="num">Actual</th><th>Status</th><th class="noprint"></th></tr></thead><tbody>${tks.map(t=>{const a=taskMins(t.id),e=+t.est||0,over=e&&a>e*1.5;if(ui.edit===t.id)return`<tr><td colspan="6"><form class="form" data-form="edit" data-id="${esc(t.id)}"><div class="g4">${field('e:'+t.id,'title','Task',{value:t.title})}${field('e:'+t.id,'client','Client',{value:t.client||''})}${field('e:'+t.id,'date','Due',{type:'date',value:t.date})}${field('e:'+t.id,'est','Expected minutes',{type:'number',value:t.est||''})}</div><div class="row"><button class="btn primary sm">Save</button><button type="button" class="btn quiet sm" data-a="editc">Cancel</button></div></form></td></tr>`;return`<tr><td>${esc(t.title)}${t.client?` <span class="pill">${esc(t.client)}</span>`:''}</td><td class="mono">${short(t.date)}</td><td class="num">${e?dur(e):'–'}</td><td class="num">${dur(a)}</td><td>${t.done?'<span class="pill good">Finished</span>':t.date<today()?'<span class="pill bad">Overdue</span>':'<span class="pill">Open</span>'} ${over?'<span class="pill warn">Over expected</span>':''}</td><td class="noprint"><button class="x" data-a="edit" data-id="${esc(t.id)}">Edit</button>${del('task',t.id)}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="empty">No tasks due this week.</p>'}</section>
 <section class="sheet"><h2>Time by software</h2><p class="small muted">An entry counts in full for each tool ticked, so tools can overlap.</p>${Object.keys(tool).length?`<div class="tw"><table><thead><tr><th>Tool</th><th class="num">Time</th></tr></thead><tbody>${Object.entries(tool).sort((a,b)=>b[1]-a[1]).map(([t,x])=>`<tr><td>${esc(t)}</td><td class="num">${dur(x)}</td></tr>`).join('')}</tbody></table></div>`:'<p class="empty">Nothing logged yet.</p>'}</section>`}
function csv(){const m=ui.week,fri=add(m,4),q=s=>`"${String(s??'').replace(/"/g,'""')}"`,rows=[['Date','Start','End','Minutes','Method','Task','Client','Software','Detail','Link','Things to check']];S.entries.filter(e=>e.date>=m&&e.date<=fri&&!e.needsDetail).sort((a,b)=>ms(a.startAt)-ms(b.startAt)).forEach(e=>rows.push([e.date,hm(e.startAt),hm(e.endAt),mins(e),e.method,e.taskTitle,e.client,(e.tools||[]).join('; '),e.detail,e.proof,eFlags(e).map(f=>f[0]).join('; ')]));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}));a.download=`Casey-timesheet-${m}.csv`;a.click()}

/* render */
function shell(body){const u=ui.user;return`<header class="top"><div><p class="eyebrow"><span class="chips"><i style="background:var(--magenta)"></i><i style="background:var(--blue)"></i><i style="background:var(--yellow)"></i><i style="background:var(--ink)"></i></span>Bundle Media</p><h1>${u.mgr?'Casey\'s time log':'My time log'}</h1></div><button class="btn quiet sm noprint" data-a="out">Sign out</button></header>${body}`}
function vLogin(){return`<section class="sheet login"><h1>Bundle Time Log</h1><form class="form" data-form="login">${field('login','email','Email',{type:'email'})}${field('login','pass','Password',{type:'password'})}<button class="btn primary">Sign in</button><button type="button" class="x" data-a="forgot">Forgot password?</button></form></section>`}
function draw(){pending=false;if(!ui.user){app.innerHTML=vLogin();return}app.innerHTML=shell(ui.user.mgr?vManager():vEmployee());tick()}
function render(){const a=document.activeElement;if(a&&app.contains(a)&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type!=='checkbox'))){pending=true;return}draw()}
function tick(){const r=S.running,c=$('clock');if(r&&c){const s=Math.max(0,Math.floor((Date.now()-ms(r.startedAt))/1000));c.textContent=`${Math.floor(s/3600)}:${pad(Math.floor(s/60)%60)}:${pad(s%60)}`;document.title=`${Math.floor(s/3600)}:${pad(Math.floor(s/60)%60)} Bundle Time Log`}else document.title='Bundle Time Log';
 if(r&&!ui.user?.mgr){const age=Date.now()-ms(r.confirmedAt);if(age>=CHECK+GRACE)closeTimer(true);else if(age>=CHECK&&!document.querySelector('[data-a=confirm]'))render()}}
setInterval(tick,1000);
async function closeTimer(auto){if(closing||!S.running)return;closing=true;const r=S.running;await save(async()=>{await addDoc(collection(db,'ts_entries'),{date:r.date,taskId:r.taskId,taskTitle:r.taskTitle,client:r.client||'',startAt:r.startedAt,endAt:auto?new Date(ms(r.confirmedAt)+CHECK):serverTimestamp(),method:'timer',needsDetail:true,detail:'',proof:'',tools:[],unconfirmed:!!auto,loggedAt:serverTimestamp()});await deleteDoc(doc(db,'ts_running','casey'))}).then(ok=>{if(!ok)closing=false})}

/* actions */
const A={out(){signOut(auth)},forgot(){const em=v('login','email','').trim();if(!em)return toast('Enter your email first');sendPasswordResetEmail(auth,em).then(()=>toast('Password reset email sent'),()=>toast('That email couldn\'t be used'))},
 wk(d){ui.week=add(ui.week,+d.n);draw()},csv,print(){window.print()},typed(){ui.typed=!ui.typed;draw()},edit(d){ui.edit=d.id;draw()},editc(){ui.edit=null;draw()},
 stop(){closeTimer(false)},confirm(){save(()=>updateDoc(doc(db,'ts_running','casey'),{confirmedAt:serverTimestamp()}),'Thanks')},
 checked(d,el){save(()=>updateDoc(doc(db,'ts_entries',d.id),{checked:el.checked}))},
 reopen(d){save(()=>setDoc(doc(db,'ts_days',d.id),{reopened:true,submittedAt:null}),'Casey can add time to this day')},
 sure(d){if(ui.sure===d.k){ui.sure=null;X[d.act](d.id)}else ui.sure=d.k;draw()}};
const X={task:id=>save(()=>deleteDoc(doc(db,'ts_tasks',id))),entry:id=>save(()=>deleteDoc(doc(db,'ts_entries',id))),submit(){const t=today();const data={submittedAt:serverTimestamp(),reopened:false,minutes:dayMins(t)};save(()=>setDoc(doc(db,'ts_days',t),data),'Day submitted')}};
const F={async login(){try{await signInWithEmailAndPassword(auth,v('login','email','').trim(),v('login','pass',''));D.login={}}catch{toast('Incorrect email or password')}},
 start(){const id=v('start','task',openTasks()[0]?.id||'other'),t=S.tasks.find(x=>x.id===id),title=id==='other'?String(v('start','other','')).trim():t?.title;if(!title)return toast('Say what the work is');if(!canLog(today()))return toast('Today has been submitted');save(()=>setDoc(doc(db,'ts_running','casey'),{date:today(),taskId:id,taskTitle:title,client:t?.client||'',startedAt:serverTimestamp(),confirmedAt:serverTimestamp()}))},
 async detail(form){const id=form.dataset.id,f='det:'+id,e=S.entries.find(x=>x.id===id),tools=TOOLS.filter(x=>v(f,'t:'+x,false)),detail=String(v(f,'detail','')).trim();if(!tools.length)return toast('Tick the software you used');if(detail.length<30)return toast('Add more detail: client, what you did, what is left');const ok=await save(()=>updateDoc(doc(db,'ts_entries',id),{tools,detail,proof:String(v(f,'proof','')).trim(),needsDetail:false,detailAt:serverTimestamp()}),'Saved');if(ok&&v(f,'fin',false)&&e.taskId!=='other')await save(()=>updateDoc(doc(db,'ts_tasks',e.taskId),{done:true,doneAt:serverTimestamp()}));delete D[f]},
 async typed(){const f='typed',d=v(f,'date',today()),a=v(f,'from',''),b=v(f,'to',''),tools=TOOLS.filter(x=>v(f,'t:'+x,false)),detail=String(v(f,'detail','')).trim(),reason=String(v(f,'reason','')).trim();if(!canLog(d))return toast('This day is closed. Ask Megan to allow a catch-up.');if(!a||!b||b<=a)return toast('Check the times');const st=new Date(`${d}T${a}:00`),en=new Date(`${d}T${b}:00`);if(en>new Date())return toast('The end time can\'t be in the future');if(dayEntries(d).some(e=>ms(e.startAt)<en&&ms(e.endAt)>st))return toast('These times overlap another entry');if(!tools.length||!reason||detail.length<30)return toast('Add the software, the reason and more detail');const id=v(f,'task','other'),t=S.tasks.find(x=>x.id===id);await save(()=>addDoc(collection(db,'ts_entries'),{date:d,taskId:id,taskTitle:t?.title||'Other work',client:t?.client||'',startAt:st,endAt:en,method:'typed',needsDetail:false,detail,proof:String(v(f,'proof','')).trim(),tools,reason,unconfirmed:false,loggedAt:serverTimestamp(),detailAt:serverTimestamp()}),'Added');delete D[f];ui.typed=false;draw()},
 async task(){const f=D.task||{},title=(f.title||'').trim();if(!title)return toast('Name the task');await save(()=>addDoc(collection(db,'ts_tasks'),{title,client:(f.client||'').trim(),date:f.date||today(),est:+f.est||0,note:(f.note||'').trim(),done:false,createdBy:ui.user.name,createdAt:serverTimestamp()}),'Task added');D.task={date:f.date};draw()},
 async edit(form){const id=form.dataset.id,f='e:'+id,t=S.tasks.find(x=>x.id===id);await save(()=>updateDoc(doc(db,'ts_tasks',id),{title:v(f,'title',t.title),client:v(f,'client',t.client||''),date:v(f,'date',t.date),est:+v(f,'est',t.est||0)||0}),'Task updated');delete D[f];ui.edit=null;draw()}};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(ui.sure&&el.dataset.a!=='sure')ui.sure=null;A[el.dataset.a]?.(el.dataset,el)});
document.addEventListener('input',e=>{const el=e.target;if(!el.dataset?.d)return;const i=el.dataset.d.indexOf('|'),f=el.dataset.d.slice(0,i),k=el.dataset.d.slice(i+1);(D[f]??={})[k]=el.type==='checkbox'?el.checked:el.value});
document.addEventListener('change',e=>{if(e.target.dataset?.live)draw()});document.addEventListener('focusout',()=>{if(pending)setTimeout(()=>pending&&render(),60)});
document.addEventListener('submit',e=>{e.preventDefault();F[e.target.dataset.form]?.(e.target)});
onAuthStateChanged(auth,u=>{subs.forEach(s=>s());subs=[];const t=u&&TEAM[(u.email||'').toLowerCase()];if(u&&!t){signOut(auth);return}ui.user=t||null;if(t){ui.week=monday(today());const err=e=>{console.warn(e);toast('This login can\'t see the time log yet.')};
 subs.push(onSnapshot(collection(db,'ts_tasks'),s=>{S.tasks=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));render()},err),onSnapshot(collection(db,'ts_entries'),s=>{S.entries=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));render()},err),onSnapshot(collection(db,'ts_days'),s=>{S.days=Object.fromEntries(s.docs.map(d=>[d.id,d.data({serverTimestamps:'estimate'})]));render()},err),onSnapshot(doc(db,'ts_running','casey'),s=>{S.running=s.exists()?s.data({serverTimestamps:'estimate'}):null;if(!S.running)closing=false;render()},err))}draw()});
</script></body></html>
